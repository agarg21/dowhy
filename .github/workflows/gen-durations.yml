# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
name: gen-durations

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        poetry-version: [2.1.3]
        test-group: [1, 2, 3, 4, 5, 6]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry ${{ matrix.poetry-version }}
      uses: abatilo/actions-poetry@v4.0.0
      with:
        poetry-version: ${{ matrix.poetry-version }}

    - name: Configure Poetry to use in-project virtualenv
      run: poetry config virtualenvs.in-project true

    - name: Cache virtualenv
      id: cache-venv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ matrix.python-version }}-

    # At the moment needed to support scipy in Python 3.12+
    # Only required when building from source (i.e., no cached venv)
    - name: Install LLVM and Clang
      if: steps.cache-venv.outputs.cache-hit != 'true'
      uses: KyleMayes/install-llvm-action@v2.0.5
      with:
        version: "14.0"
        directory: ${{ runner.temp }}/llvm

    - name: Install graphviz
      run: |
        sudo apt-get update -q
        sudo apt install graphviz libgraphviz-dev graphviz-dev pkg-config libopenblas-dev gfortran

    - name: Install dependencies
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade pip
        echo "installing poetry dependencies"
        poetry install -E plotting -E pygraphviz -E econml

    - name: Lint
      run: poetry run poe lint

    - name: Check Formatting
      run: poetry run poe format_check

    - name: Test
      continue-on-error: true
      run: poetry run poe test --splits 6 --group ${{ matrix.test-group }} --store-durations --durations-path durations-${{ matrix.test-group }}.json

    - uses: actions/upload-artifact@v4
      with:
        name: durations-${{ matrix.test-group }}
        path: durations-${{ matrix.test-group }}.json
